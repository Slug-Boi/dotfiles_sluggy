prSections:
  - title: "Pull Requests"
    filters: "is:open"
  - title: "My Pull Requests"
    filters: "is:open author:@me"
  - title: "Needs My Review"
    filters: "is:open review-requested:@me"
  - title: "Involved"
    filters: "is:open involves:@me -author:@me"

issuesSections:
  - title: "Issues"
    filters: "is:open"
  - title: "My Issues"
    filters: "is:open author:@me"
  - title: "Assigned"
    filters: "is:open assignee:@me"
  - title: "Involved"
    filters: "is:open involves:@me -author:@me"
  - title: "Done"
    filters: "is:closed"

notificationsSections:
  - title: "All"
    filters: ""
  - title: "Created"
    filters: "reason:author"
  - title: "Participating"
    filters: "reason:participating"
  - title: "Mentioned"
    filters: "reason:mention"
  - title: "Review Requested"
    filters: "reason:review-requested"
  - title: "Assigned"
    filters: "reason:assign"
  - title: "Subscribed"
    filters: "reason:subscribed"
  - title: "Team Mentioned"
    filters: "reason:team-mention"

pager:
  diff: diffnav
showAuthorIcons: true
smartFilteringAtLaunch: true

defaults:
  view: prs
  refetchIntervalMinutes: 5
  layout:
    prs:
      repoName:
        grow: true,
        width: 10
        hidden: false
      base:
        hidden: true
  preview:
    open: true
    width: 84
  prsLimit: 20
  issuesLimit: 20
  notificationsLimit: 20

keybindings:
  universal:
    - key: g
      name: lazygit
      command: >
        cd {{.RepoPath}} && lazygit
  prs:
    - key: T
      name: gh-enhance
      command: >-
        sh -c '
          if [ -n "$ZELLIJ" ]; then
            zellij action new-tab --command sh -- -c "gh enhance -R {{.RepoName}} {{.PrNumber}}"
          else
            gh enhance {{.PrNumber}}
          fi
        '
    - key: v
      name: review
      command: >
        sh -c '
        if [ -n "$ZELLIJ" ]; then 
          zellij action new-tab --command sh -- -c "gh pr review {{.PrNumber}}"
        else
          gh pr review
        fi
        '

theme:
  ui:
    sectionsShowCount: true
    table:
      compact: false
  colors:
    text:
      primary: "#BFBFBF"      # Foreground
      secondary: "#767C77"    # Black(Bright)
      inverted: "#121212"     # Background
      faint: "#404040"        # Visual
      warning: "#FFD700"      # Yellow
      success: "#00CC7A"      # Green
    background:
      selected: "#232323"     # Black
    border:
      primary: "#404040"      # Visual
      secondary: "#232323"    # Black
      faint: "#1A1A1A"        # slightly lighter than Background
